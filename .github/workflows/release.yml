name: Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  build-executables:
    name: Build ${{ matrix.os }} Executable
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            artifact_name: rx-scanner-windows
            asset_name: rx-scanner-windows-x86_64.exe
          - os: macos-latest
            artifact_name: rx-scanner-macos
            asset_name: rx-scanner-macos-x86_64

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pyinstaller

      - name: Build executable with PyInstaller
        run: pyinstaller --name rx-scanner --onefile --windowed --add-data "rx_scanner:rx_scanner" rx_scanner/main.py

      - name: Rename executable (Unix)
        if: runner.os != 'Windows'
        run: |
          mv dist/rx-scanner dist/${{ matrix.asset_name }}

      - name: Rename executable (Windows)
        if: runner.os == 'Windows'
        run: |
          Move-Item dist/rx-scanner.exe dist/${{ matrix.asset_name }}

      - name: Upload executable artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/${{ matrix.asset_name }}
          retention-days: 1

  create-release:
    name: Create GitHub Release
    needs: build-executables
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Display structure of downloaded files
        run: ls -R artifacts/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/rx-scanner-windows/rx-scanner-windows-x86_64.exe
            artifacts/rx-scanner-macos/rx-scanner-macos-x86_64
          generate_release_notes: true
          draft: false
          prerelease: false
          body: |
            ## 🚀 RX Scanner Release

            ### 📥 Download
            Choose the appropriate version for your operating system:

            - **Windows**: `rx-scanner-windows-x86_64.exe`
            - **macOS**: `rx-scanner-macos-x86_64`

            ### 📝 Installation

            #### Windows
            1. Download `rx-scanner-windows-x86_64.exe`
            2. Double-click to run

            #### macOS
            1. Download `rx-scanner-macos-x86_64`
            2. Right-click → "Open" → Click "Open" again

            Or use Terminal:
            ```bash
            chmod +x rx-scanner-macos-x86_64
            ./rx-scanner-macos-x86_64
            ```

            ### 🔄 Changes
            See below for detailed changes in this release.
